<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Canteen Order System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        input, select, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        .btn-add { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-order { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .cart-section { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Campus Canteen Order System</h2>
    
    <input type="text" id="name" placeholder="Student ID / Name" required>
    
    <div style="display: flex; gap: 10px;">
        <select id="item" style="flex: 2;">
            <option value="Chicken Singara">Chicken Singara (Tk 20)</option>
            <option value="Samosa">Samosa (Tk 15)</option>
            <option value="Cold Coffee">Cold Coffee (Tk 40)</option>
            <option value="Noodles">Noodles (Tk 35)</option>
            <option value="Puri">Puri (Tk 10)</option>
            <option value="Ice Cream">Ice Cream (Tk 100)</option>
        </select>
        <input type="number" id="qty" min="1" value="1" style="flex: 1;" required>
    </div>
    <button type="button" class="btn-add" onclick="addToCart()">Add to Cart</button>

    <!-- Cart View -->
    <div class="cart-section">
        <h3>Your Cart</h3>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>
        <h4>Total: Tk <span id="cartTotal">0</span></h4>
        <button type="button" class="btn-order" onclick="placeOrder()">Place Order</button>
    </div>

    <!-- Recent Orders -->
    <h3>Recent Orders</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Items Ordered</th>
                <th>Grand Total</th>
            </tr>
        </thead>
        <tbody id="orderTable"></tbody>
    </table>

    <script>
        const priceList = { 
            "Chicken Singara": 20, 
            "Samosa": 15, 
            "Cold Coffee": 40,
            "Noodles": 35,
            "Puri": 10,
            "Ice Cream": 100 
        };

        let cart = [];

        function addToCart() {
            const item = document.getElementById('item').value;
            const qty = parseInt(document.getElementById('qty').value);
            const price = priceList[item] * qty;

            cart.push({ item, qty, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartTable = document.getElementById('cartTable');
            cartTable.innerHTML = '';
            let total = 0;

            cart.forEach(c => {
                total += c.price;
                cartTable.innerHTML += `<tr>
                    <td>${c.item}</td>
                    <td>${c.qty}</td>
                    <td>Tk ${c.price}</td>
                </tr>`;
            });

            document.getElementById('cartTotal').innerText = total;
        }

        function placeOrder() {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter Student ID / Name!');
                return;
            }
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const itemsSummary = cart.map(c => `${c.item} (x${c.qty})`).join(', ');
            const grandTotal = document.getElementById('cartTotal').innerText;

            const orderTable = document.getElementById('orderTable');
            orderTable.innerHTML += `<tr>
                <td>${name}</td>
                <td>${itemsSummary}</td>
                <td>Tk ${grandTotal}</td>
            </tr>`;

            // Reset Cart & Form
            cart = [];
            updateCartUI();
            document.getElementById('name').value = '';
            document.getElementById('qty').value = '1';
        }
    </script>
</body>
</html>
